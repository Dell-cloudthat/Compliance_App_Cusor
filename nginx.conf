# SPA fallback: any path that isn't a static file serves index.html, so
# client-side routing (the ?invite= query param handling in App.jsx) works
# correctly on hard refresh / direct link visits.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is never cached
    # so deploys take effect immediately for new visitors.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
